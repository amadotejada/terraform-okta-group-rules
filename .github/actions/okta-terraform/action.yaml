name: Okta Terraform setup
description: Python, Terraform, AWS state access and scoped Okta credentials, then terraform init. Reads AWS_* and TF_STATE_BUCKET from the workflow env.
inputs:
  okta-oauth:
    description: OKTA_OAUTH secret content
    required: true
  okta-scopes:
    description: Comma separated Okta scopes. Plans only need read.
    default: okta.groups.read
  session-name:
    description: AWS role session name, shows up in CloudTrail
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # reference v7.1.0
      with:
        python-version: "3.12"
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # reference v4.0.1
      with:
        terraform_version: 1.17.0
        terraform_wrapper: false
    - name: Install script dependencies
      shell: bash
      run: python3 -m pip install -q -r scripts/requirements.txt
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # reference v6.3.0
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: ${{ inputs.session-name }}
    - name: Verify AWS account identity
      shell: bash
      run: test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
    - name: Okta provider credentials
      shell: bash
      env:
        OKTA_OAUTH: ${{ inputs.okta-oauth }}
        OKTA_SCOPES: ${{ inputs.okta-scopes }}
      run: python3 scripts/okta_rules.py provider-env --scopes "$OKTA_SCOPES"
    - name: Terraform init
      shell: bash
      run: terraform init -input=false -no-color -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
