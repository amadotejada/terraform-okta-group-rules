name: Drift check
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      import:
        description: Push an okta-import branch with the Okta GUI changes so you can open a PR
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Repo variables (Settings > Secrets and variables > Actions > Variables). Jobs that need AWS skip until TF_STATE_BUCKET is set.
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
concurrency:
  group: okta-group-rules-drift
  cancel-in-progress: false
jobs:
  detect:
    if: ${{ github.ref == 'refs/heads/main' && vars.TF_STATE_BUCKET != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.export.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reference v7.0.1
        with:
          persist-credentials: false
      - id: pending
        name: Skip while a deploy is waiting or running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Merged but not yet applied changes would otherwise look like GUI drift.
          busy=0
          for status in requested queued pending waiting in_progress; do
            n="$(gh run list -R "$GITHUB_REPOSITORY" -w deploy.yaml -s "$status" --json databaseId -q length)"
            busy=$((busy + n))
          done
          echo "busy=$busy" >> "$GITHUB_OUTPUT"
          if [ "$busy" != 0 ]; then echo "### Skipped: a Deploy run is waiting or running" >> "$GITHUB_STEP_SUMMARY"; fi
      - if: ${{ steps.pending.outputs.busy == '0' }}
        uses: ./.github/actions/okta-terraform
        with:
          okta-oauth: ${{ secrets.OKTA_OAUTH }}
          session-name: okta-group-rules-drift
      - id: export
        if: ${{ steps.pending.outputs.busy == '0' }}
        name: Compare Okta with Git
        env:
          OKTA_OAUTH: ${{ secrets.OKTA_OAUTH }}
        run: |
          set -euo pipefail
          terraform state pull > "$RUNNER_TEMP/state.json"
          python3 scripts/okta_rules.py export --state "$RUNNER_TEMP/state.json"
      # The person running an import already knows about the drift.
      - if: ${{ !inputs.import && steps.export.outputs.changes != '' && steps.export.outputs.changes != '0' }}
        uses: ./.github/actions/slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          file: slack.txt
          text: "Revert them in Okta, or run the Drift check workflow with import checked to bring them into Git:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - if: ${{ inputs.import && steps.export.outputs.changes != '' && steps.export.outputs.changes != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # reference v7.0.2
        with:
          name: okta-import-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          # slack.txt is the drift table, reused for the import's Slack message
          path: |
            rules/
            slack.txt
      - if: failure()
        uses: ./.github/actions/slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          text: "Okta drift check FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  import-branch:
    needs: detect
    if: ${{ inputs.import && needs.detect.outputs.changes != '' && needs.detect.outputs.changes != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reference v7.0.1
        with:
          persist-credentials: false
      - run: rm -rf rules
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # reference v8.0.2
        with:
          name: okta-import-${{ github.run_id }}
      - id: push
        name: Push okta-import branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # e.g. okta-import/octocat/2026-10-28-1430 (UTC). Bot names have [ ], which git refs don't allow.
          branch="okta-import/${GITHUB_ACTOR//[^A-Za-z0-9-]/-}/$(date -u +%Y-%m-%d-%H%M)"
          git switch -c "$branch"
          git add -A rules
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Import Okta GUI rule changes (run $GITHUB_RUN_ID)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          echo "### Open a PR to review the import: $compare" >> "$GITHUB_STEP_SUMMARY"
          { echo "branch=$branch"; echo "compare=$compare"; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          file: slack.txt
          actor: ${{ github.actor }}
          text: "{actor} imported these Okta GUI changes into branch `${{ steps.push.outputs.branch }}`. Open the PR to review and merge:\n${{ steps.push.outputs.compare }}"
      - if: failure()
        uses: ./.github/actions/slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          text: "Okta import FAILED, no branch was pushed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
# Opening the PR by hand is on purpose: PRs created with GITHUB_TOKEN don't trigger the Validate checks.
