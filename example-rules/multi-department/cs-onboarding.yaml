# The team shows up under more than one department, so the rule matches all of them.
emp-cs-onboarding-tr:
  name: Emp CS - Onboarding TR
  expression: (user.userType=="Employee") and (user.department=="Customer Success" or user.department=="Sales") and (user.team=="CS - Onboarding")
  groups:
    - salesforce-users
    - zendesk-agents
  status: ACTIVE
